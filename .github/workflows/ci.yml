name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, and self-host
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run compiler and tool regressions
        run: ctest --test-dir build --parallel 2 --output-on-failure -LE selfhost

      - name: Run self-hosting workflow
        run: scripts/self_host.sh

      - name: Validate VS Code extension files
        working-directory: tools/vscode-nova-syntax
        run: scripts/validate.sh
